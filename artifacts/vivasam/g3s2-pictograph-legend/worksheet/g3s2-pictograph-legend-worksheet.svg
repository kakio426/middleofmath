<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" role="img" aria-label="그림 하나에 숨은 수 통합 활동지">
  <text x="124" y="91" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="#FFFFFF">eduitit</text>
  <text x="1140" y="82" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="750" text-anchor="end" fill="#6D5A87">01 / 30</text>
  <text x="78" y="196" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="42" font-weight="900" fill="#352064" text-anchor="start" class=""><tspan x="78" dy="0">그림 하나에 숨은 수</tspan></text>
  <text x="80" y="286" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#6A6073" text-anchor="start" class=""><tspan x="80" dy="0">초등 3학년 2학기 · 6. 그림그래프</tspan></text>
  <text x="1142" y="286" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#6A6073">이름 __________________</text>
  <g aria-label="범례가 있는 그림그래프"><rect x="924" y="132" width="230" height="113" rx="25" fill="#FFFFFF" opacity=".82"/><text x="949" y="211" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#0E7490">★</text><text x="1003" y="211" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#0E7490">★</text><text x="1057" y="211" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#0E7490">★</text><text x="1111" y="211" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#F5C451">★</text><text x="952" y="258" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800" fill="#0E7490">★ 1개 = 5</text></g>
  <path d="M78 332 C300 312 488 350 700 329 S1000 320 1158 335" fill="none" stroke="#D5C5EB" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="378" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="850" fill="#6B4AA0">생각 순서</text>
  <text x="196" y="378" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#44384F" text-anchor="start" class=""><tspan x="196" dy="0">1. 행 고르기 → 2. 그림 세기 → 3. 범례 적용 → 4. 비교·설명</tspan></text>

  <g>
    <circle cx="94" cy="478" r="23" fill="#0E7490"/>
    <text x="94" y="486" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="132" y="486" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#164E63">먼저 같이 풀어 봐요</text>
    <line x1="132" y1="503" x2="1148" y2="503" stroke="#0E7490" stroke-width="3" opacity=".38"/>
  </g>
  <text x="92" y="544" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#665E72" text-anchor="start" class=""><tspan x="92" dy="0">범례: ● 1개 = 2개 · 첫째 줄: ● 4개 · 둘째 줄: ● 2개</tspan></text>
  <text x="92" y="604" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="800" fill="#302441" text-anchor="start" class=""><tspan x="92" dy="0">첫째 줄의 귤은 모두 몇 개? / 두 줄은 몇 개 차이?</tspan></text>

  <text x="92" y="744" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">식과 답</text>
  <line x1="196" y1="742" x2="1136" y2="742" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/><line x1="196" y1="790" x2="1136" y2="790" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="818" r="23" fill="#0E7490"/>
    <text x="94" y="826" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="132" y="826" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#164E63">이번에는 혼자 풀어 봐요</text>
    <line x1="132" y1="843" x2="1148" y2="843" stroke="#0E7490" stroke-width="3" opacity=".38"/>
  </g>
  <text x="92" y="882" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="800" fill="#302441" text-anchor="start" class=""><tspan x="92" dy="0">두 공원에는 모두 몇 그루? / A는 B보다 몇 그루 더 많을까? /</tspan><tspan x="92" dy="31">범례를 넣어 설명하기</tspan></text>
  <text x="92" y="962" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#665E72" text-anchor="start" class=""><tspan x="92" dy="0">범례: ■ 1개 = 10그루 · 공원 A: ■ 3개 · 공원 B: ■ 2개</tspan></text>
  <text x="92" y="1020" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">풀이와 설명</text>
  <line x1="220" y1="1018" x2="1136" y2="1018" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/><line x1="220" y1="1066" x2="1136" y2="1066" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="1126" r="23" fill="#0E7490"/>
    <text x="94" y="1134" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="132" y="1134" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#164E63">어디에서 생각이 달라졌을까요?</text>
    <line x1="132" y1="1151" x2="1148" y2="1151" stroke="#0E7490" stroke-width="3" opacity=".38"/>
  </g>
  <g><text x="96" y="1190" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="850" fill="#0E7490">A.</text><text x="132" y="1190" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="132" dy="0">생각 A: 네모가 모두 5개라서 5그루예요.</tspan></text></g><g><text x="96" y="1272" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="850" fill="#0E7490">B.</text><text x="132" y="1272" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="132" dy="0">생각 B: A만 계산해서 3×10=30그루예요.</tspan></text></g>
  <text x="92" y="1348" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">먼저 고칠 부분과 그 까닭</text>
  <line x1="298" y1="1346" x2="1136" y2="1346" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="1410" r="23" fill="#0E7490"/>
    <text x="94" y="1418" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="132" y="1418" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#164E63">수업을 마치며 확인해요</text>
    <line x1="132" y1="1435" x2="1148" y2="1435" stroke="#0E7490" stroke-width="3" opacity=".38"/>
  </g>
  <g><circle cx="102" cy="1467" r="18" fill="#0E7490"/><text x="102" y="1474" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#FFFFFF">1</text><text x="138" y="1474" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="138" dy="0">● 한 개가 3명일 때, ● 5개와 ● 3개는 몇 명 차이일까요?</tspan></text><line x1="138" y1="1509" x2="1140" y2="1509" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g><g><circle cx="102" cy="1549" r="18" fill="#0E7490"/><text x="102" y="1556" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#FFFFFF">2</text><text x="138" y="1556" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="138" dy="0">★ 한 개가 5권일 때, 25권을 나타내려면 ★가 몇 개 필요할까요?</tspan></text><line x1="138" y1="1591" x2="1140" y2="1591" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g><g><circle cx="102" cy="1631" r="18" fill="#F5C451"/><text x="102" y="1638" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#164E63">3</text><text x="190" y="1638" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="190" dy="0">그림그래프를 읽을 때 그림 수보다 먼저 확인할 것은 무엇일까요?</tspan></text><line x1="190" y1="1673" x2="1140" y2="1673" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g>
  <text x="82" y="1705" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="750" fill="#766A80">MIDDLE OF MATH</text>
