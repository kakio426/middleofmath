<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" role="img" aria-label="같은 묶음은 곱셈으로 통합 활동지">
  <text x="124" y="91" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="#FFFFFF">eduitit</text>
  <text x="1140" y="82" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="750" text-anchor="end" fill="#6D5A87">02 / 30</text>
  <text x="78" y="196" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="42" font-weight="900" fill="#352064" text-anchor="start" class=""><tspan x="78" dy="0">같은 묶음은 곱셈으로</tspan></text>
  <text x="80" y="286" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#6A6073" text-anchor="start" class=""><tspan x="80" dy="0">초등 3학년 1학기 · 1. 곱셈</tspan></text>
  <text x="1142" y="286" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#6A6073">이름 __________________</text>
  <g aria-label="같은 묶음 배열"><rect x="922" y="120" width="234" height="137" rx="30" fill="#FFFFFF" opacity=".78"/><circle cx="956" cy="150" r="13" fill="#6941C6"/><circle cx="1008" cy="150" r="13" fill="#6941C6"/><circle cx="1060" cy="150" r="13" fill="#6941C6"/><circle cx="1112" cy="150" r="13" fill="#6941C6"/><circle cx="956" cy="196" r="13" fill="#F7C948"/><circle cx="1008" cy="196" r="13" fill="#F7C948"/><circle cx="1060" cy="196" r="13" fill="#F7C948"/><circle cx="1112" cy="196" r="13" fill="#F7C948"/><circle cx="956" cy="242" r="13" fill="#6941C6"/><circle cx="1008" cy="242" r="13" fill="#6941C6"/><circle cx="1060" cy="242" r="13" fill="#6941C6"/><circle cx="1112" cy="242" r="13" fill="#6941C6"/><path d="M942 231H1136" stroke="#6941C6" stroke-width="5" stroke-linecap="round"/></g>
  <path d="M78 332 C300 312 488 350 700 329 S1000 320 1158 335" fill="none" stroke="#D5C5EB" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="378" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="850" fill="#6B4AA0">생각 순서</text>
  <text x="196" y="378" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#44384F" text-anchor="start" class=""><tspan x="196" dy="0">1. 한 묶음의 수 찾기 → 2. 묶음 수 찾기 → 3. 두 수를 곱셈식으로 나타내기 → 4. 단위를 붙여 전체</tspan><tspan x="196" dy="24">말하기</tspan></text>

  <g>
    <circle cx="94" cy="478" r="23" fill="#6941C6"/>
    <text x="94" y="486" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="132" y="486" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#352064">먼저 같이 풀어 봐요</text>
    <line x1="132" y1="503" x2="1148" y2="503" stroke="#6941C6" stroke-width="3" opacity=".38"/>
  </g>
  <text x="92" y="544" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#665E72" text-anchor="start" class=""><tspan x="92" dy="0">붙임 딱지를 한 줄에 5장씩 6줄 붙였어요.</tspan></text>
  <text x="92" y="604" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="800" fill="#302441" text-anchor="start" class=""><tspan x="92" dy="0">붙임 딱지는 모두 몇 장일까요?</tspan></text>
<text x="92" y="696" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#6941C6" text-anchor="start" class=""><tspan x="92" dy="0">보기 30장 / 11장 / 6장</tspan></text>
  <text x="92" y="744" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">식과 답</text>
  <line x1="196" y1="742" x2="1136" y2="742" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/><line x1="196" y1="790" x2="1136" y2="790" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="818" r="23" fill="#6941C6"/>
    <text x="94" y="826" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="132" y="826" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#352064">이번에는 혼자 풀어 봐요</text>
    <line x1="132" y1="843" x2="1148" y2="843" stroke="#6941C6" stroke-width="3" opacity=".38"/>
  </g>
  <text x="92" y="882" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="800" fill="#302441" text-anchor="start" class=""><tspan x="92" dy="0">귤이 한 접시에 4개씩 5접시 있습니다. 귤은 모두 몇 개일까요?</tspan></text>
  <text x="92" y="962" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#665E72" text-anchor="start" class=""><tspan x="92" dy="0">한 접시 4개 · 접시 5개</tspan></text>
  <text x="92" y="1020" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">풀이와 설명</text>
  <line x1="220" y1="1018" x2="1136" y2="1018" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/><line x1="220" y1="1066" x2="1136" y2="1066" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="1126" r="23" fill="#6941C6"/>
    <text x="94" y="1134" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="132" y="1134" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#352064">어디에서 생각이 달라졌을까요?</text>
    <line x1="132" y1="1151" x2="1148" y2="1151" stroke="#6941C6" stroke-width="3" opacity=".38"/>
  </g>
  <g><text x="96" y="1190" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="850" fill="#6941C6">A.</text><text x="132" y="1190" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="132" dy="0">검토할 답 3+4=7 · 첫 오류는?</tspan></text></g><g><text x="96" y="1272" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="850" fill="#6941C6">B.</text><text x="132" y="1272" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="132" dy="0">검토할 답 4 · 첫 오류는?</tspan></text></g>
  <text x="92" y="1348" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800" fill="#6A6073">먼저 고칠 부분과 그 까닭</text>
  <line x1="298" y1="1346" x2="1136" y2="1346" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>

  <g>
    <circle cx="94" cy="1410" r="23" fill="#6941C6"/>
    <text x="94" y="1418" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="850" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="132" y="1418" font-family="Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="850" fill="#352064">수업을 마치며 확인해요</text>
    <line x1="132" y1="1435" x2="1148" y2="1435" stroke="#6941C6" stroke-width="3" opacity=".38"/>
  </g>
  <g><circle cx="102" cy="1467" r="18" fill="#6941C6"/><text x="102" y="1474" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#FFFFFF">1</text><text x="138" y="1474" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="138" dy="0">붙임 딱지는 모두 몇 장일까요?</tspan></text><line x1="138" y1="1509" x2="1140" y2="1509" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g><g><circle cx="102" cy="1549" r="18" fill="#6941C6"/><text x="102" y="1556" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#FFFFFF">2</text><text x="138" y="1556" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="138" dy="0">귤이 한 접시에 4개씩 5접시 있습니다. 귤은 모두 몇 개일까요?</tspan></text><line x1="138" y1="1591" x2="1140" y2="1591" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g><g><circle cx="102" cy="1631" r="18" fill="#F7C948"/><text x="102" y="1638" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="850" text-anchor="middle" fill="#352064">3</text><text x="190" y="1638" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="650" fill="#3C3447" text-anchor="start" class=""><tspan x="190" dy="0">다음 관계가 필요한 까닭을 한 문장으로 쓰세요: 한 묶음의 수 × 묶음 수 =</tspan><tspan x="190" dy="24">전체 수</tspan></text><line x1="190" y1="1673" x2="1140" y2="1673" stroke="#BEB1D1" stroke-width="2" stroke-dasharray="7 9"/></g>
  <text x="82" y="1705" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="750" fill="#766A80">MIDDLE OF MATH</text>
</svg>
