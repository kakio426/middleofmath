    <text x="108" y="590" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#4B4754" text-anchor="start" class=""><tspan x="108" dy="0">47개를 6개씩 묶으면 7묶음이 되고</tspan><tspan x="108" dy="24">5개가 남아요. 알맞은 식은 무엇일까요?</tspan></text><text x="108" y="656" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="800" fill="#164E48" text-anchor="start" class=""><tspan x="108" dy="0">47개를 6개씩 묶으면 7묶음이 되고</tspan><tspan x="108" dy="27">5개가 남아요. 알맞은 식은</tspan><tspan x="108" dy="27">무엇일까요?</tspan></text><text x="108" y="766" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="start" class=""><tspan x="108" dy="0">선택: 6×7+5=47 /</tspan><tspan x="108" dy="23">6×5+7=37 / 6+7+5=18</tspan></text><text x="108" y="832" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#615B6C" text-anchor="start" class=""><tspan x="108" dy="0">식과 답</tspan></text><line x1="108" y1="860" x2="554" y2="860" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/><line x1="108" y1="888" x2="554" y2="888" stroke="#BFB8CE" stroke-width="2" stroke-dasharray="8 8"/>
