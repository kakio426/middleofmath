name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Most pushes to this repo publish lesson artifacts and never touch shipped
  # code. Running Docker Supabase, pgTAP, and two Playwright browsers for those
  # costs ~17 minutes and, through Release staging, a live database migration.
  # Classify first so each change pays only for what it can actually break.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Shipped code, database schema, dependencies, and the harnesses that
          # judge them: full suite, and a staging release.
          app_re='^(apps|packages|supabase|e2e|e2e-staging|e2e-production|scripts)/|^package(-lock)?\.json$|^\.github/workflows/|^(tsconfig|vitest|playwright)[^/]*\.(json|ts|mjs|js)$'
          # Generated output and prose: nothing to verify.
          skip_re='^(artifacts|docs|ask-me-plan|tmp|test-results)/|^[^/]*\.md$'

          # The default shell runs with -e, so let a failed lookup fall through to
          # the empty-list fail-safe below instead of killing the step.
          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') || true
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$HEAD_SHA" --jq '.files[]?.filename') || true
          fi

          count=$(printf '%s\n' "$files" | grep -c . || true)

          # A new branch, a force push, an API failure, or a diff past GitHub's
          # 300-file compare cap all leave us unable to prove the change is
          # harmless. Run everything rather than guess.
          if [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "::notice::Changed files were unavailable or truncated ($count listed), so the full suite runs."
            echo "tier=app" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$files" | grep -qE "$app_re"; then
            tier=app
          elif printf '%s\n' "$files" | grep -qvE "$skip_re"; then
            tier=code
          else
            tier=skip
          fi

          echo "$count changed file(s) -> tier=$tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

  # Lesson tooling under tools/ carries real vitest coverage but cannot reach the
  # database, the browser, or the deployed bundles. Type check and unit test it.
  fast:
    needs: changes
    if: needs.changes.outputs.tier == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  verify:
    needs: changes
    if: needs.changes.outputs.tier == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 2.112.0 rewrote the CLI in TypeScript and validates Management API
          # responses against a generated schema, so `supabase link` dies on the
          # api-keys `inserted_at` timestamp. `latest` also resolves through the
          # GitHub API, which rate-limits anonymous runners.
          version: 2.111.0

      - run: npm ci
      - name: Reproduce pinned curriculum snapshots
        run: npm run test:crosswalk-repro
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Start isolated local Supabase
        run: supabase start

      - name: Verify migrations and pgTAP policies
        run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys
        run: npm run test:e2e
      - name: Collect remote smoke suites without credentials
        run: npm run test:smoke:contract

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was never installed, so there is nothing to stop."
          fi
