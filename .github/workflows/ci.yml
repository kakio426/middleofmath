name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 2.112.0 rewrote the CLI in TypeScript and validates Management API
          # responses against a generated schema, so `supabase link` dies on the
          # api-keys `inserted_at` timestamp. `latest` also resolves through the
          # GitHub API, which rate-limits anonymous runners.
          version: 2.111.0

      - run: npm ci
      - name: Reproduce pinned curriculum snapshots
        run: npm run test:crosswalk-repro
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Start isolated local Supabase
        run: supabase start

      - name: Verify migrations and pgTAP policies
        run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys
        run: npm run test:e2e
      - name: Collect remote smoke suites without credentials
        run: npm run test:smoke:contract

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was never installed, so there is nothing to stop."
          fi
