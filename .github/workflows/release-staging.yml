name: Release staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  # CI decides whether a push can affect what we ship. When it can, CI runs its
  # `verify` job; otherwise `verify` is skipped. Releasing on a skipped verify
  # would migrate the staging database and redeploy three apps to publish a PDF,
  # so read that decision back instead of trusting the run conclusion alone.
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Release only what the full suite verified
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          verify=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "verify") | .conclusion] | first // "absent"')
          echo "CI verify job: $verify"
          if [ "$verify" = "success" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This push changed no shipped code, so staging keeps its current release."
          fi

  preflight-secrets:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_STUDENT: ${{ secrets.VERCEL_PROJECT_ID_STUDENT }}
      VERCEL_PROJECT_ID_TEACHER: ${{ secrets.VERCEL_PROJECT_ID_TEACHER }}
      VERCEL_PROJECT_ID_STUDIO: ${{ secrets.VERCEL_PROJECT_ID_STUDIO }}
      STAGING_TEACHER_EMAIL: ${{ secrets.STAGING_TEACHER_EMAIL }}
      STAGING_TEACHER_PASSWORD: ${{ secrets.STAGING_TEACHER_PASSWORD }}
    steps:
      - name: Fail before migration or deploy when a secret is missing
        shell: bash
        run: |
          missing=0
          required=(
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF
            VERCEL_TOKEN VERCEL_ORG_ID
            VERCEL_PROJECT_ID_STUDENT VERCEL_PROJECT_ID_TEACHER VERCEL_PROJECT_ID_STUDIO
            STAGING_TEACHER_EMAIL STAGING_TEACHER_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required in the staging environment"
              missing=1
            fi
          done
          exit "$missing"

  migrate:
    needs: preflight-secrets
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 2.112.0 rejects the api-keys `inserted_at` timestamp and breaks
          # `supabase link`. See the matching comment in ci.yml.
          version: 2.111.0
      - name: Link staging without interactive credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Apply the reviewed migration chain
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

  deploy:
    needs: [preflight-secrets, migrate]
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: student
            project_secret: VERCEL_PROJECT_ID_STUDENT
            staging_alias: middle-of-math-student-staging.vercel.app
          - app: teacher
            project_secret: VERCEL_PROJECT_ID_TEACHER
            staging_alias: middle-of-math-teacher-staging.vercel.app
          - app: studio
            project_secret: VERCEL_PROJECT_ID_STUDIO
            staging_alias: middle-of-math-studio-staging.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull staging environment
        working-directory: apps/${{ matrix.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
        run: npx vercel@56.5.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build and deploy immutable artifact
        working-directory: apps/${{ matrix.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
        run: |
          npx vercel@56.5.0 build --token="$VERCEL_TOKEN"
          supabase_url=$(sed -n 's/^VITE_SUPABASE_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' .vercel/.env.preview.local)
          echo "pulled VITE_SUPABASE_URL: ${supabase_url:-(not set)}"
          case "$supabase_url" in
            "")
              echo "::error::apps/${{ matrix.app }} pulled no VITE_SUPABASE_URL from the Vercel Preview environment."
              exit 1 ;;
            *127.0.0.1*|*localhost*)
              echo "::error::apps/${{ matrix.app }} pulled a local VITE_SUPABASE_URL ($supabase_url). Point the Vercel Preview environment at the staging project."
              exit 1 ;;
          esac
          if ! grep -rqF "$supabase_url" .vercel/output/static; then
            echo "::error::apps/${{ matrix.app }} built without $supabase_url in its bundle, so the pulled environment never reached the build."
            exit 1
          fi
          deployment_url=$(npx vercel@56.5.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          npx vercel@56.5.0 alias set "$deployment_url" "${{ matrix.staging_alias }}" --token="$VERCEL_TOKEN"

  smoke:
    needs: [preflight-secrets, deploy]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the invited-teacher pilot journey
        env:
          STAGING_STUDENT_URL: https://middle-of-math-student-staging.vercel.app
          STAGING_TEACHER_URL: https://middle-of-math-teacher-staging.vercel.app
          STAGING_STUDIO_URL: https://middle-of-math-studio-staging.vercel.app
          STAGING_TEACHER_EMAIL: ${{ secrets.STAGING_TEACHER_EMAIL }}
          STAGING_TEACHER_PASSWORD: ${{ secrets.STAGING_TEACHER_PASSWORD }}
        run: npm run test:smoke:staging
