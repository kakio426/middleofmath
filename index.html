<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="초등 수 세기와 5학년 분수 풀이 과정을 한 판단씩 기록하고 교사용 진단으로 해석하는 프로토타입"
    />
    <title>Middle of Math</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./questions.js"></script>

    <script defer src="./app.js"></script>

  <body>
    <div class="app-shell">
